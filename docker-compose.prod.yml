services:
  app:
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      # Keep synthetic data and spoofing/fake accounts disabled in production.
      ENABLE_DEMO_DATA: "false"
      ENABLE_DEMO_ACCOUNTS: "false"
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: "lax"
    restart: always
