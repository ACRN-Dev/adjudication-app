services:
  app:
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      # Enable DB wipe (Reset All Demo Data) for the supervisor meeting
      ENABLE_DEMO_DATA: "true"
      # Keep spoofing/fake accounts disabled since they use real accounts
      ENABLE_DEMO_ACCOUNTS: "false"
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: "lax"
    restart: always
